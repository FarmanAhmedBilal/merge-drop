<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Merge Drop Arcade</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0b0f14">
<style>
  :root{--bg:#0b0f14;--surface:#121a23;--line:#22303e;--text:#e6edf3;--dim:#8b9bab;--accent:#2dd4bf;--accent-ink:#06251f;--gold:#fde047}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{min-height:100dvh;background:radial-gradient(1100px 650px at 50% -8%,#143040,#0b0f14 68%);color:var(--text);font-family:ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top) clamp(12px,3vw,32px) calc(env(safe-area-inset-bottom) + 24px)}
  main{max-width:1180px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:center;padding-top:16px}
  .logo{font-size:12px;font-weight:900;letter-spacing:.3em;color:var(--dim)}
  .round{width:44px;height:44px;border-radius:50%;border:1px solid #2a3a4a;background:rgba(255,255,255,.05);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .round svg{display:block}.round:hover{border-color:#3a4f66}
  h1{font-size:clamp(34px,6vw,58px);font-weight:950;letter-spacing:.01em;margin:clamp(22px,5vw,48px) 0 6px}
  .sub{color:var(--dim);font-size:clamp(14px,1.6vw,17px);margin:0 0 26px}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 22px}
  .stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .stat span{font-size:10px;letter-spacing:.12em;color:var(--dim);font-weight:850}.stat b{display:block;font-size:clamp(20px,3vw,28px);margin-top:4px;font-variant-numeric:tabular-nums}
  #library{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .card{display:flex;align-items:center;gap:14px;min-width:0;min-height:122px;background:linear-gradient(145deg,rgba(255,255,255,.035),transparent 62%),var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;transition:border-color .2s,transform .15s,box-shadow .2s}
  .card:hover{border-color:#3a5268;transform:translateY(-2px);box-shadow:0 12px 35px rgba(0,0,0,.2)}.card:active{transform:scale(.99)}
  .thumb{flex:0 0 auto;width:78px;height:78px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);position:relative;overflow:hidden}
  .meta{flex:1;min-width:0}.name{font-weight:900;font-size:clamp(15px,1.7vw,19px);letter-spacing:.04em}.tag{color:var(--dim);font-size:13px;margin:3px 0 7px;line-height:1.3}.best{color:var(--accent);font-size:12px;font-weight:850;font-variant-numeric:tabular-nums}
  .play{flex:0 0 auto;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:14px;text-decoration:none;padding:11px 18px;border-radius:999px;box-shadow:0 6px 22px rgba(45,212,191,.22)}.play:active{transform:translateY(1px)}
  .m-tile{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:800;color:#08131b;border-radius:10px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
  .m-tile.t1{width:36px;height:36px;left:8px;top:12px;background:var(--accent);transform:rotate(-10deg);font-size:18px}.m-tile.t2{width:40px;height:40px;left:26px;top:28px;background:var(--gold);transform:rotate(9deg);font-size:20px}
  .bit{position:absolute;width:6px;height:6px;border-radius:2px}.bit.b1{left:64px;top:12px;background:var(--accent)}.bit.b2{left:14px;top:58px;background:var(--gold)}.bit.b3{left:52px;top:64px;background:#67e8f9}
  .thumb svg{position:absolute;inset:0;width:100%;height:100%}.glow-g{filter:drop-shadow(0 0 5px rgba(74,222,128,.55))}.glow-r{filter:drop-shadow(0 0 5px rgba(248,113,113,.55))}
  footer{display:flex;align-items:center;justify-content:space-between;margin-top:20px;border-top:1px solid var(--line);padding-top:18px}.fright{display:flex;align-items:center;gap:14px}.vsep{width:1px;height:20px;background:var(--line)}footer a{color:var(--text);text-decoration:none;font-size:14px}footer a:hover{color:var(--accent)}
  button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  @media(min-width:1080px){#library{grid-template-columns:repeat(3,minmax(0,1fr))}.card{padding:16px;gap:16px}.thumb{width:84px;height:84px}.play{padding:12px 22px}}
  @media(max-width:700px){#library{grid-template-columns:1fr;gap:10px}.card{min-height:104px;padding:12px}.thumb{width:70px;height:70px}.m-tile.t1{left:5px;top:8px}.m-tile.t2{left:22px;top:24px}.bit.b1{left:55px}.bit.b2{top:51px}.bit.b3{left:46px;top:56px}.play{padding:11px 16px}}
  @media(max-width:370px){body{padding-left:10px;padding-right:10px}.logo{font-size:10px;letter-spacing:.2em}.card{gap:9px}.thumb{width:60px;height:60px;border-radius:14px}.tag{font-size:11px}.play{font-size:12px;padding:10px 13px}.stats{gap:6px}.stat{padding:10px 8px}.stat span{font-size:8px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
  <header>
    <span class="logo">THE MERGE DROP ARCADE</span>
    <button class="round" id="soundTop" title="Sound"></button>
  </header>

  <h1>CHOOSE YOUR NEXT RUN</h1>
  <p class="sub">Quick games, clean controls, one more high score.</p>

  <div class="stats">
    <div class="stat"><span>GAMES</span><b id="stGames">5</b></div>
    <div class="stat"><span>TOTAL PLAYS</span><b id="stPlays">0</b></div>
    <div class="stat"><span>BEST SCORE</span><b id="stBest">0</b></div>
  </div>

  <section id="library"></section>

  <div id="adSlot"></div>

  <footer>
    <button class="round" id="soundFoot" title="Sound"></button>
    <span class="fright"><span class="vsep"></span><a href="privacy.html">Privacy</a></span>
  </footer>
</main>

<script src="games.js"></script>
<script>
'use strict';
/* The hub reads each game's namespaced storage to keep scores and totals in sync. */
const GAMES = window.ARCADE_GAMES;

function read(key){
  try{ return JSON.parse(localStorage.getItem(key) || '{}'); }
  catch(e){ return {}; }
}

const ICONS = {
  merge: '<div class="m-tile t1">2</div><div class="m-tile t2">4</div>' +
         '<i class="bit b1"></i><i class="bit b2"></i><i class="bit b3"></i>',
  snake: '<svg class="glow-g" viewBox="0 0 64 64">' +
         '<path d="M15 49 V39 Q15 31 23 31 H41 Q49 31 49 23 V15" fill="none" stroke="#4ade80" stroke-width="9" stroke-linecap="round"/>' +
         '<circle cx="15" cy="49" r="6.5" fill="#86efac"/>' +
         '<rect x="45" y="45" width="7" height="7" rx="1.5" fill="none" stroke="#f87171" stroke-width="2"/>' +
         '<rect x="12" y="8" width="7" height="7" rx="1.5" fill="none" stroke="#f87171" stroke-width="2"/>' +
         '</svg>',
  target: '<svg class="glow-r" viewBox="0 0 64 64">' +
         '<circle cx="32" cy="32" r="15" fill="none" stroke="#f87171" stroke-width="3.5"/>' +
         '<line x1="32" y1="6" x2="32" y2="18" stroke="#f87171" stroke-width="3.5" stroke-linecap="round"/>' +
         '<line x1="32" y1="46" x2="32" y2="58" stroke="#f87171" stroke-width="3.5" stroke-linecap="round"/>' +
         '<line x1="6" y1="32" x2="18" y2="32" stroke="#f87171" stroke-width="3.5" stroke-linecap="round"/>' +
         '<line x1="46" y1="32" x2="58" y2="32" stroke="#f87171" stroke-width="3.5" stroke-linecap="round"/>' +
         '<circle cx="32" cy="32" r="5" fill="#f87171"/>' +
         '</svg>',
  shooter: '<svg viewBox="0 0 64 64"><path d="M8 27h16l8-8 8 8h16v14H40l-8 8-8-8H8z" fill="#fb7185" stroke="#ffc2ca" stroke-width="2"/><circle cx="32" cy="34" r="6" fill="#0b0f14"/><path d="M32 8v10M32 46v10M6 34h10M48 34h10" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/><circle cx="32" cy="34" r="18" fill="none" stroke="#67e8f9" stroke-width="1.5" opacity=".7"/></svg>',
  stack: '<svg viewBox="0 0 64 64"><path d="M12 47h40v8H12z" fill="#8b5cf6"/><path d="M17 35h30v8H17z" fill="#a78bfa"/><path d="M23 23h24v8H23z" fill="#c4b5fd"/><path d="M8 17h38v5H8z" fill="#fde047" transform="rotate(-8 27 19)"/><path d="M12 57h40" stroke="#e9ddff" stroke-width="2" stroke-linecap="round"/></svg>'
};

function render(){
  const data = GAMES.map(g => ({ g, d: read(g.key) }));
  document.getElementById('stGames').textContent = GAMES.length;
  document.getElementById('stPlays').textContent =
    data.reduce((n, x) => n + (x.d.games || 0), 0);
  document.getElementById('stBest').textContent =
    data.reduce((m, x) => Math.max(m, x.d.best || 0), 0).toLocaleString();
  document.getElementById('library').innerHTML = data.map(({ g, d }) =>
    '<div class="card"><div class="thumb">' + ICONS[g.icon] + '</div>' +
    '<div class="meta"><div class="name">' + g.name + '</div>' +
    '<div class="tag">' + g.tagline + '</div>' +
    '<span class="best">' + ((d.games || 0) ? 'BEST ' + (d.best || 0).toLocaleString() : 'BEST —') + '</span></div>' +
    '<a class="play" href="' + g.href + '">Play</a></div>'
  ).join('');
}

let hubSound = true;
try{ hubSound = JSON.parse(localStorage.getItem('hub-v1') || '{}').sound !== false; }catch(e){}

const SND_ON  = '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 9.5a3.6 3.6 0 0 1 0 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M18.5 7.5a6.4 6.4 0 0 1 0 9" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const SND_OFF = '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><line x1="16" y1="9" x2="21" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="21" y1="9" x2="16" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

function paintSound(){
  const ic = hubSound ? SND_ON : SND_OFF;
  document.getElementById('soundTop').innerHTML = ic;
  document.getElementById('soundFoot').innerHTML = ic;
}
function toggleSound(){
  hubSound = !hubSound;
  try{ localStorage.setItem('hub-v1', JSON.stringify({ sound: hubSound })); }catch(e){}
  paintSound();
}
document.getElementById('soundTop').addEventListener('click', toggleSound);
document.getElementById('soundFoot').addEventListener('click', toggleSound);

window.addEventListener('pageshow', render);
paintSound();
render();
if('serviceWorker' in navigator && window.isSecureContext){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
<script src="ads.js" data-context="hub"></script>
</body>
</html>
