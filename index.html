<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Merge Drop Arcade</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0b0f14">
<style>
  :root{
    --bg:#0b0f14; --surface:#121a23; --line:#22303e; --text:#e6edf3;
    --dim:#8b9bab; --accent:#2dd4bf; --accent-ink:#06251f; --gold:#fde047;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; }
  body{
    min-height:100dvh;
    background:radial-gradient(900px 520px at 50% -8%, #143040, #0b0f14 68%);
    color:var(--text);
    font-family:ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
    padding:env(safe-area-inset-top) 20px calc(env(safe-area-inset-bottom) + 28px);
  }
  main{ max-width:560px; margin:0 auto; }

  header{ display:flex; justify-content:space-between; align-items:center; padding-top:18px; }
  .logo{ font-size:12px; font-weight:800; letter-spacing:.3em; color:var(--dim); }
  .round{ width:44px; height:44px; border-radius:50%; border:1px solid #2a3a4a;
          background:rgba(255,255,255,.05); color:var(--text); font-size:18px;
          cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .round svg{ display:block; }
  .round:hover{ border-color:#3a4f66; }

  h1{ font-size:clamp(34px, 9vw, 46px); font-weight:900; letter-spacing:.01em;
      margin:34px 0 6px; }
  .sub{ color:var(--dim); font-size:16px; margin:0 0 26px; }

  .stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:0 0 22px; }
  .stat{ background:rgba(255,255,255,.04); border:1px solid var(--line);
         border-radius:14px; padding:14px 14px 12px; }
  .stat span{ font-size:11px; letter-spacing:.12em; color:var(--dim); font-weight:800; }
  .stat b{ display:block; font-size:26px; margin-top:4px; font-variant-numeric:tabular-nums; }

  .card{ display:flex; align-items:center; gap:16px; background:var(--surface);
         border:1px solid var(--line); border-radius:20px; padding:16px; margin-bottom:14px;
         transition:border-color .2s, transform .1s; }
  .card:hover{ border-color:#33465a; }
  .card:active{ transform:scale(.99); }
  .thumb{ flex:0 0 auto; width:84px; height:84px; border-radius:18px;
          background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06);
          position:relative; overflow:hidden; }
  .meta{ flex:1; min-width:0; }
  .name{ font-weight:800; font-size:19px; letter-spacing:.04em; }
  .tag{ color:var(--dim); font-size:14px; margin:2px 0 6px; }
  .best{ color:var(--accent); font-size:13px; font-weight:800; font-variant-numeric:tabular-nums; }
  .play{ flex:0 0 auto; background:var(--accent); color:var(--accent-ink); font-weight:800;
         font-size:16px; text-decoration:none; padding:13px 30px; border-radius:999px;
         box-shadow:0 6px 22px rgba(45,212,191,.3); }
  .play:active{ transform:translateY(1px); }

  .m-tile{ position:absolute; display:flex; align-items:center; justify-content:center;
           font-weight:800; color:#08131b; border-radius:10px;
           box-shadow:inset 0 -3px 0 rgba(0,0,0,.25); }
  .m-tile.t1{ width:36px; height:36px; left:8px; top:12px; background:var(--accent);
              transform:rotate(-10deg); font-size:18px; }
  .m-tile.t2{ width:40px; height:40px; left:26px; top:28px; background:var(--gold);
              transform:rotate(9deg); font-size:20px; }
  .bit{ position:absolute; width:6px; height:6px; border-radius:2px; }
  .bit.b1{ left:64px; top:12px; background:var(--accent); }
  .bit.b2{ left:14px; top:58px; background:var(--gold); }
  .bit.b3{ left:52px; top:64px; background:#67e8f9; }
  .thumb svg{ position:absolute; inset:0; width:100%; height:100%; }
  .glow-g{ filter:drop-shadow(0 0 5px rgba(74,222,128,.55)); }
  .glow-r{ filter:drop-shadow(0 0 5px rgba(248,113,113,.55)); }

  footer{ display:flex; align-items:center; justify-content:space-between;
          margin-top:34px; border-top:1px solid var(--line); padding-top:18px; }
  .fright{ display:flex; align-items:center; gap:14px; }
  .vsep{ width:1px; height:20px; background:var(--line); }
  footer a{ color:var(--text); text-decoration:none; font-size:15px; }
  footer a:hover{ color:var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <span class="logo">THE MERGE DROP ARCADE</span>
    <button class="round" id="soundTop" title="Sound"></button>
  </header>

  <h1>PICK YOUR POISON</h1>
  <p class="sub">Three tiny games. Endless one-more-run energy.</p>

  <div class="stats">
    <div class="stat"><span>GAMES</span><b id="stGames">3</b></div>
    <div class="stat"><span>TOTAL PLAYS</span><b id="stPlays">0</b></div>
    <div class="stat"><span>BEST SCORE</span><b id="stBest">0</b></div>
  </div>

  <section id="library"></section>

  <footer>
    <button class="round" id="soundFoot" title="Sound"></button>
    <span class="fright"><span class="vsep"></span><a href="privacy.html">Privacy</a></span>
  </footer>
</main>

<script>
'use strict';
/* Games register here: the hub reads each game's namespaced storage to
   remember per-game high scores and keep the totals in sync. */
const GAMES = [
  { name:'MERGE DROP',  tagline:'gravity + greed',    href:'merge-drop.html',  key:'merge-drop-v1',  icon:'merge'  },
  { name:'NEON SNAKE',  tagline:'grip it and grow',   href:'neon-snake.html',  key:'neon-snake-v1',  icon:'snake'  },
  { name:'QUICK DRAW',  tagline:'reflex under fire',  href:'quick-draw.html',  key:'quick-draw-v1',  icon:'target' }
];

function read(key){
  try{ return JSON.parse(localStorage.getItem(key) || '{}'); }
  catch(e){ return {}; }
}

const ICONS = {
  merge: '<div class="m-tile t1">2</div><div class="m-tile t2">4</div>' +
         '<i class="bit b1"></i><i class="bit b2"></i><i class="bit b3"></i>',
  snake: '<svg class="glow-g" viewBox="0 0 64 64">' +
         '<path d="M15 49 V39 Q15 31 23 31 H41 Q49 31 49 23 V15" fill="none" stroke="#4ade80" stroke-width="9" stroke-linecap="round"/>' +
         '<circle cx="15" cy="49" r="6.5" fill="#86efac"/>' +
         '<rect x="45" y="45" width="7" height="7" rx="1.5" fill="none" stroke="#f87171" stroke-width="2"/>' +
         '<rect x="12" y="8" width="7" height="7" rx="1.5" fill="none" stroke="#f87171" stroke-width="2"/>' +
         '</svg>',
  target: '<svg class="glow-r" viewBox="0 0 64 64">' +
         '<circle cx="32" cy="32" r="15" fill="none" stroke="#f87171" stroke-width="3.5"/>' +
         '<line x1="32" y1="6" x2="32" y2="18" stroke="#f87171" stroke-width="3.5" stroke-linecap="round"/>' +
         '<line x1="32" y1="46" x2="32" y2="58" stroke="#f87171" stroke-width="3.5" stroke-linecap="round"/>' +
         '<line x1="6" y1="32" x2="18" y2="32" stroke="#f87171" stroke-width="3.5" stroke-linecap="round"/>' +
         '<line x1="46" y1="32" x2="58" y2="32" stroke="#f87171" stroke-width="3.5" stroke-linecap="round"/>' +
         '<circle cx="32" cy="32" r="5" fill="#f87171"/>' +
         '</svg>'
};

function render(){
  const data = GAMES.map(g => ({ g, d: read(g.key) }));
  document.getElementById('stGames').textContent = GAMES.length;
  document.getElementById('stPlays').textContent =
    data.reduce((n, x) => n + (x.d.games || 0), 0);
  document.getElementById('stBest').textContent =
    data.reduce((m, x) => Math.max(m, x.d.best || 0), 0).toLocaleString();
  document.getElementById('library').innerHTML = data.map(({ g, d }) =>
    '<div class="card"><div class="thumb">' + ICONS[g.icon] + '</div>' +
    '<div class="meta"><div class="name">' + g.name + '</div>' +
    '<div class="tag">' + g.tagline + '</div>' +
    '<span class="best">' + ((d.games || 0) ? 'BEST ' + (d.best || 0).toLocaleString() : 'BEST —') + '</span></div>' +
    '<a class="play" href="' + g.href + '">Play</a></div>'
  ).join('');
}

let hubSound = true;
try{ hubSound = JSON.parse(localStorage.getItem('hub-v1') || '{}').sound !== false; }catch(e){}

const SND_ON  = '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 9.5a3.6 3.6 0 0 1 0 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M18.5 7.5a6.4 6.4 0 0 1 0 9" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
const SND_OFF = '<svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><line x1="16" y1="9" x2="21" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="21" y1="9" x2="16" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

function paintSound(){
  const ic = hubSound ? SND_ON : SND_OFF;
  document.getElementById('soundTop').innerHTML = ic;
  document.getElementById('soundFoot').innerHTML = ic;
}
function toggleSound(){
  hubSound = !hubSound;
  try{ localStorage.setItem('hub-v1', JSON.stringify({ sound: hubSound })); }catch(e){}
  paintSound();
}
document.getElementById('soundTop').addEventListener('click', toggleSound);
document.getElementById('soundFoot').addEventListener('click', toggleSound);

window.addEventListener('pageshow', render);
paintSound();
render();
if('serviceWorker' in navigator && window.isSecureContext){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
